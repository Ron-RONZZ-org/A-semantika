[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "A-semantika"
version = "0.1.0"
description = "Semantic triple store for fragmented, machine-inferencable knowledge note-taking"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{name = "Rong ZHOU", email = "rong.zhou6@etu.univ-lorraine.fr"}]
requires-python = ">=3.11"
dependencies = [
    "A-core>=0.1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.entry-points."A.commands"]
semantika = "A_semantika.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/A_semantika"]

[tool.uv.sources]
a-core = { path = "../A-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
